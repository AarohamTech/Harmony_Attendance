<style>
        @keyframes scale-in {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes draw-check {
            0% { stroke-dashoffset: 48; }
            100% { stroke-dashoffset: 0; }
        }
        .animate-check-container { animation: scale-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .animate-check-path { 
            stroke-dasharray: 48; 
            stroke-dashoffset: 48;

<script>
        // Set dynamic date
        const dateEl = document.getElementById('current-date');
        const now = new Date();
        const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
        dateEl.textContent = now.toLocaleDateString('en-US', options);

        // Micro-interaction for "Done" button
        const doneBtn = document.querySelector('button');
        doneBtn.addEventListener('click', () => {
            doneBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Processing...';
            setTimeout(() => {
                // In a real app, this would navigate home
                window.location.reload(); 
            }, 800);
        });
