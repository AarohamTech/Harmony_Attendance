<!-- Subtle Micro-interaction Scripts -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simulated transition effect
            setTimeout(() => {
                const elements = document.querySelectorAll('.fade-in');
                elements.forEach((el, index) => {
                    el.style.opacity = '1';
                });
            }, 100);

            // Subtle background motion interaction (optional refinement)
            window.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) / 100;
                const moveY = (e.clientY - window.innerHeight / 2) / 100;
                const logoContainer = document.querySelector('.fade-in div');
                if (logoContainer) {
                    logoContainer.style.transform = `translate(${moveX}px, ${moveY}px)`;
                }
            });
        });
    </script>
