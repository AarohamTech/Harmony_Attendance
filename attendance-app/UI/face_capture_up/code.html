<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .camera-overlay {
            mask: radial-gradient(circle 140px at center, transparent 99%, black 100%);
            -webkit-mask: radial-gradient(circle 140px at center, transparent 99%, black 100%);
        }
        .progress-bar-glow {
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
        }
        .capture-ring {
            border: 4px solid rgba(37, 99, 235, 0.2);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .capture-ring:active {
            transform: scale(0.92);
        }
        .check-pill {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
        }
    </style>

<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface flex items-center h-16 px-margin-mobile w-full transition-colors duration-200">
<button class="mr-4 p-2 hover:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-on-surface">Enrollment</h1>
</header>
<main class="flex-1 mt-16 px-margin-mobile pb-xl flex flex-col items-center">
<!-- Progress Section -->
<div class="w-full mt-md mb-lg">
<div class="flex justify-between items-end mb-sm">
<span class="font-label-lg text-label-lg text-on-surface-variant tracking-wider uppercase">Face Biometrics</span>
<span class="font-title-lg text-title-lg text-primary">60%</span>
</div>
<div class="w-full h-2 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary-container progress-bar-glow transition-all duration-700 ease-out" style="width: 60%"></div>
</div>
</div>
<!-- Camera Canvas Section -->
<div class="relative w-full aspect-[3/4] max-w-sm rounded-[32px] overflow-hidden shadow-sm bg-surface-container-lowest">
<!-- Simulated Camera Feed -->
<div class="absolute inset-0 bg-cover bg-center" data-alt="A high-quality, professional portrait of a young office professional looking slightly upward into a camera. The lighting is soft and even, typical of an office environment with neutral white walls. The person has a neutral expression, showing clear facial features for biometric enrollment. The image is crisp, clean, and centers the face within a circular guide frame, following an enterprise software aesthetic with a minimalist white and corporate blue color scheme." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDAHDvJ_6ZjhrgpFqZDCRaDfkvPXyh5nSHn2YpRKno2JU5UJJ1uJdo3jCwvDcR78W_b7sKOE54wKzDMsVyY8mwQw20m2nXabBwqRvH4dwUktId8sg4Mrl2ctKiMNOu94wchImgXKbJOG72PCtMLWlyogsIUnUA1jZxF1Gj4RbWFuComEodR0Ao90-aW-a_3cD-vZ2EQisU2OqH_kPMWdPv7Mu7s6HUIDd9mvuCRDyGbmOmL1QOPn40T')"></div>
<!-- Face Guide Overlay -->
<div class="absolute inset-0 camera-overlay bg-on-surface/40 flex flex-col items-center justify-center">
<div class="w-[280px] h-[280px] rounded-full border-2 border-dashed border-white/60 animate-pulse"></div>
</div>
<!-- Directional Instructions Overlay -->
<div class="absolute top-md left-0 right-0 flex justify-center">
<div class="bg-primary/90 backdrop-blur-md px-lg py-sm rounded-full flex items-center gap-sm">
<span class="material-symbols-outlined text-white text-[20px]" data-icon="arrow_upward">arrow_upward</span>
<span class="text-white font-label-lg">Look slightly upward</span>
</div>
</div>
<!-- Completion Checkmarks -->
<div class="absolute bottom-md left-0 right-0 px-md flex justify-center gap-sm">
<div class="check-pill px-sm py-xs rounded-full flex items-center gap-xs shadow-sm">
<span class="material-symbols-outlined text-primary text-[16px] font-bold" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
<span class="font-label-md text-on-surface">Front</span>
</div>
<div class="check-pill px-sm py-xs rounded-full flex items-center gap-xs shadow-sm">
<span class="material-symbols-outlined text-primary text-[16px] font-bold" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
<span class="font-label-md text-on-surface">Left</span>
</div>
<div class="check-pill px-sm py-xs rounded-full flex items-center gap-xs shadow-sm">
<span class="material-symbols-outlined text-primary text-[16px] font-bold" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
<span class="font-label-md text-on-surface">Right</span>
</div>
<div class="bg-white/30 backdrop-blur-md border border-white/40 px-sm py-xs rounded-full flex items-center gap-xs">
<div class="w-2 h-2 rounded-full bg-white animate-bounce"></div>
<span class="font-label-md text-white">Up</span>
</div>
</div>
</div>
<!-- Capture Controls -->
<div class="w-full flex flex-col items-center mt-xl">
<div class="p-4 rounded-full bg-surface-container shadow-sm mb-lg">
<button class="capture-ring w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-lg active:shadow-none">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[32px]" data-icon="camera_alt">camera_alt</span>
</div>
</button>
</div>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-[280px]">
                Ensure your face is within the guide and maintain a neutral expression.
            </p>
</div>
</main>
<!-- BottomNavBar SUPPRESSED per Transactional/Task-Focused Rule -->
<script>
        // Micro-interaction for capture feedback
        const captureBtn = document.querySelector('.capture-ring');
        captureBtn.addEventListener('click', () => {
            // Visual flash feedback
            const flash = document.createElement('div');
            flash.className = 'fixed inset-0 bg-white z-[100] transition-opacity duration-300';
            document.body.appendChild(flash);
            setTimeout(() => {
                flash.style.opacity = '0';
                setTimeout(() => flash.remove(), 300);
            }, 50);
            
            // Haptic/Logic would go here
        });
    </script>
</body></html>
