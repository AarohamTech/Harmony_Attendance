<!DOCTYPE html><html class="light" lang="en"><head>

                    "on-background": "#191b23",
                    "surface-bright": "#faf8ff",
                    "surface-dim": "#d9d9e5",

                    "on-primary": "#ffffff",

                    "inverse-surface": "#2e3039",
                    "inverse-on-surface": "#f0f0fb",
                    "primary-fixed": "#dbe1ff",
                    "on-error": "#ffffff",
                    "surface-variant": "#e1e2ed",
                    "on-secondary-fixed": "#0b1c30",
                    "on-error-container": "#93000a",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-fixed-variant": "#444749",
                    "surface-container-highest": "#e1e2ed",

                    "secondary-fixed": "#d3e4fe"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "base": "4px",
                    "md": "16px",
                    "gutter": "12px",
                    "sm": "8px",
                    "xl": "32px",
                    "edge_margin": "16px",
                    "xs": "4px",
                    "lg": "24px"
            },
            "fontFamily": {
                    "body-sm": ["Inter"],
                    "title-lg": ["Inter"],

          },
        },

<style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .camera-overlay {
            background: radial-gradient(circle 140px at 50% 45%, transparent 100%, rgba(0,0,0,0.65) 100%);
        }
        .scan-line {
            animation: scan 2.5s ease-in-out infinite;
        }
        @keyframes scan {
            0% { top: 30%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 60%; opacity: 0; }
        }
        .face-frame {
            border: 3px solid #2563EB;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="bg-surface border-b border-outline-variant shadow-sm docked full-width top-0 z-50 flex justify-between items-center w-full px-md h-14">
<div class="flex items-center gap-sm">
<button class="p-2 -ml-2 hover:bg-surface-container rounded-full transition-colors text-on-surface">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-title-lg font-title-lg font-bold text-primary">Punch Out</h1>
</div>
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" style="font-size: 20px;">help</span>
</div>
</div>
</header>
<main class="flex-1 relative flex flex-col items-center pt-md pb-xl px-md">
<!-- Camera Preview Container -->
<div class="relative w-full max-w-sm aspect-[3/4] rounded-3xl overflow-hidden shadow-2xl bg-black border-4 border-surface-container-highest">
<!-- Simulated Camera Feed -->
<div class="absolute inset-0 w-full h-full" data-alt="A front-facing high-resolution camera preview of a professional male employee in his 30s wearing a neutral-colored business casual shirt. He is looking directly into the camera with a calm expression against a softly blurred modern office background with natural lighting. The image is framed as a close-up for facial recognition, capturing crisp details of his features within a high-tech interface aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBZNy98dDTFlPKtRaiVaTEMkrl4Drl_gFFZOvP0mTP0KA0VcglZymO6isd2aYi1y1z9DRZDwvcKouf6AkF1dnTUItqCaERjiuhf4xPWVqnG4XMp5_63JvSIvkGRXmoBrzAMDAVYbhp7JPw7k548f2mLOwDiSQKjbIUAvOjzmDLAZImA22jFm_kqBJWK3J6asacpfBZBf8Kr1P3klR7M8NeyHRNuArnknaht6lYzl0iUsJHDSRdHYbC3')">
</div>
<!-- Scanning Overlay -->
<div class="absolute inset-0 flex items-center justify-center">
<!-- The Circular Frame -->
<div class="w-72 h-72 rounded-full face-frame relative">
<!-- Scan Line -->
<div class="scan-line absolute left-4 right-4 h-1 bg-primary/40 shadow-[0_0_15px_#2563EB] rounded-full"></div>
<!-- Corner Brackets (simulated) -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-4 text-primary font-bold">TOP</div>
</div>
</div>
<!-- Real-time feedback badges -->
<div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex flex-col gap-2 w-full px-8">
<div class="bg-surface/90 backdrop-blur-md rounded-xl py-2 px-4 flex items-center justify-between border border-primary/20">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-success-container text-green-600" data-weight="fill">check_circle</span>
<span class="font-label-md text-label-md text-on-surface">Face Verified</span>
</div>
<span class="text-[10px] text-on-surface-variant font-medium">98% MATCH</span>
</div>
<div class="bg-surface/90 backdrop-blur-md rounded-xl py-2 px-4 flex items-center justify-between border border-primary/20">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-green-600" data-weight="fill">location_on</span>
<span class="font-label-md text-label-md text-on-surface">GPS Verified</span>
</div>
<span class="text-[10px] text-on-surface-variant font-medium">IN GEOFENCE</span>
</div>
</div>
</div>
<!-- Instructional Content -->
<div class="mt-8 text-center space-y-2">
<h2 class="font-headline-md-mobile text-headline-md-mobile text-on-surface">End of Shift</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[280px] mx-auto">
                Please look directly at the screen and ensure your face is within the circle to record your exit time.
            </p>
</div>
<!-- Primary Action -->
<div class="mt-auto w-full max-w-sm px-4 pb-20">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-title-lg text-title-lg flex items-center justify-center gap-3 shadow-lg hover:bg-on-primary-fixed-variant transition-all active:scale-95" id="captureBtn">
<span class="material-symbols-outlined">logout</span>
                Capture Punch Out
            </button>
<p class="text-center mt-4 font-label-sm text-label-sm text-outline">
                Time: <span class="font-bold" id="currentTime">05:01 PM</span> • Aug 24, 2024
            </p>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 pb-safe px-sm bg-surface shadow-[0_-2px_4px_rgba(0,0,0,0.04)]">
<button class="flex flex-col items-center justify-center text-secondary px-4 py-1 hover:bg-surface-container-high transition-all">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
<span class="font-label-sm text-label-sm">Attendance</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary px-4 py-1 hover:bg-surface-container-high transition-all">
<span class="material-symbols-outlined">quick_reference_all</span>
<span class="font-label-sm text-label-sm">Requests</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary px-4 py-1 hover:bg-surface-container-high transition-all">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</nav>
<script>
        // Simple micro-interaction for the capture button
        const btn = document.getElementById('captureBtn');
        btn.addEventListener('click', () => {
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Processing...';
            btn.classList.add('opacity-80', 'pointer-events-none');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check</span> Success';
                btn.style.backgroundColor = '#10b981'; // Success Green
                
                // Vibrate if mobile
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(50);
                }
            }, 1500);
        });

        // Dynamic Clock Update
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            const clockEl = document.getElementById('currentTime');
            if (clockEl) clockEl.textContent = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body></html>
