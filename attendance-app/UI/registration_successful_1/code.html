<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #faf8ff;
            overflow: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Animated gradient for background subtle texture */
        .bg-mesh {
            background-color: #faf8ff;
            background-image: 
                radial-gradient(at 0% 0%, hsla(217,100%,90%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,100%,90%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(210,100%,90%,1) 0, transparent 50%);
            background-size: 100% 100%;
        }

        .success-bounce {
            animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;

<body class="bg-mesh min-h-screen flex items-center justify-center p-md">

<script>
        // Micro-interaction: Confetti Effect
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                this.size = Math.random() * 8 + 4;
                this.color = `hsl(${Math.random() * 360}, 70%, 70%)`;
                this.speed = Math.random() * 3 + 2;
                this.angle = Math.random() * 360;
                this.spin = Math.random() * 5 - 2.5;
            }

            update() {
                this.y += this.speed;
                this.angle += this.spin;
                if (this.y > canvas.height) {
                    this.y = -20;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle * Math.PI / 180);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        function initParticles() {
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();

        // Button Ripple Effect and Navigation simulation
        function handleNavigation() {
            console.log("Navigating to dashboard...");
            // In a real app: window.location.href = '/dashboard';
            document.querySelector('main').classList.add('scale-110', 'opacity-0');
            document.querySelector('main').style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
        }

        // Auto-stop confetti after 5 seconds to reduce CPU
        setTimeout(() => {
            particles = [];
        }, 5000);
    </script>
