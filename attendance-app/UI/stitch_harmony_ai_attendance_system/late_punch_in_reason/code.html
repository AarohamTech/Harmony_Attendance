<style>
        body { font-family: 'Inter', sans-serif; }
        .late-warning-glow {

<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-container-low border-b border-outline-variant dark:border-outline shadow-sm dark:shadow-none flex justify-between items-center w-full px-md h-14 sticky top-0 z-40">
<div class="flex items-center gap-sm">
<button class="material-symbols-outlined text-primary dark:text-primary-fixed p-2 rounded-full hover:bg-surface-container transition-colors">arrow_back</button>
<h1 class="text-title-lg font-title-lg font-bold text-primary dark:text-primary-fixed">Late Punch In</h1>
</div>
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full bg-surface-container overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A professional corporate headshot of a young female employee in business casual attire. She is smiling gently against a soft-focus office background with warm, natural lighting. The image maintains a clean, modern aesthetic with a high-key lighting setup that matches the brand's trustworthy and human-centric HRMS interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBk-ziTX0phzUvGLBtwvYomSnvDlkqyCQFPFYWw4EKmV0_RIOmkMPZlptxQfNh1xIjkewcvCPIZnfmNJUDJveXDBlljnA8B27Y30XAs6DCGBVrVvzWjNnCdHk_PpKvMS9tgLRt79zWEe679e5VTgixUJMRWjOXHXCjXzlUzEv4qSVMAHKxWDrranXhMmcAWttFL0MdmwSjo90wp3fnNJz4UtyVnI0HRA4AER24upekZ_ytUVgSnb7ho">
</div>
</div>
</header>
<main class="flex-grow px-md pt-lg pb-xl max-w-lg mx-auto w-full">
<!-- Warning Card -->
<div class="bg-[#F59E0B]/10 border border-[#F59E0B] rounded-xl p-md mb-lg late-warning-glow flex items-start gap-md animate-in fade-in slide-in-from-top-4 duration-500">
<span class="material-symbols-outlined text-[#F59E0B] text-[28px]" style="font-variation-settings: 'FILL' 1;">warning</span>
<div class="flex flex-col">
<h2 class="font-headline-md-mobile text-headline-md-mobile text-[#92400E] font-bold">You are late.</h2>
<p class="font-body-md text-body-md text-[#B45309] mt-1">Late by <span class="font-bold">25 Minutes</span></p>
</div>
</div>
<!-- Late Reason Form -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md shadow-sm">
<div class="mb-lg">
<h3 class="font-title-lg text-title-lg text-on-surface mb-xs">Attendance Regularization</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">Please provide a valid reason for your late arrival to avoid any salary deductions.</p>
</div>
<div class="space-y-gutter">
<!-- Dropdown -->
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-1" for="reason">Select Reason</label>
<div class="relative">
<select class="w-full h-12 px-md font-body-md text-body-md bg-surface-bright border border-outline rounded-lg appearance-none focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all cursor-pointer" id="reason">
<option disabled="" selected="" value="">Choose a category...</option>
<option value="traffic">Traffic / Road Congestion</option>
<option value="medical">Medical Emergency</option>
<option value="vehicle">Vehicle Breakdown</option>
<option value="public_transport">Public Transport Delay</option>
<option value="personal">Personal Urgent Work</option>
<option value="other">Other</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- Text Area -->
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-1" for="remarks">Remarks</label>
<textarea class="w-full p-md font-body-md text-body-md bg-surface-bright border border-outline rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all resize-none" id="remarks" placeholder="Briefly describe the situation..." rows="4"></textarea>
<p class="text-right font-label-sm text-label-sm text-on-surface-variant mt-1">Max 250 characters</p>
</div>
<!-- Info Alert -->
<div class="bg-surface-container-low p-sm rounded-lg flex items-center gap-sm">
<span class="material-symbols-outlined text-secondary text-sm">info</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">Your punch time will be recorded as 09:25 AM</p>
</div>
</div>
</div>
<!-- Submit Button -->
<div class="mt-lg">
<button class="w-full bg-primary-container text-on-primary font-headline-md-mobile text-headline-md-mobile py-md rounded-xl submit-shadow hover:opacity-90 active:scale-95 transition-all duration-200 flex justify-center items-center gap-sm">
                Submit Regularization
                <span class="material-symbols-outlined">send</span>
</button>
<button class="w-full mt-gutter text-secondary font-label-md text-label-md py-sm hover:bg-surface-container rounded-lg transition-colors">
                Cancel &amp; Back
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 pb-safe px-sm bg-surface dark:bg-surface-container shadow-[0_-2px_4px_rgba(0,0,0,0.04)]">
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1 hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-on-secondary-fixed-variant text-on-secondary-container dark:text-secondary-fixed rounded-full px-4 py-1 scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
<span class="font-label-sm text-label-sm">Attendance</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1 hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined">quick_reference_all</span>
<span class="font-label-sm text-label-sm">Requests</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1 hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</nav>
<script>
        // Simple micro-interaction for button feedback
        document.querySelector('button.bg-primary-container').addEventListener('click', function() {
            const btn = this;
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Processing...';
            btn.classList.add('opacity-80');
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Submitted Successfully';
                btn.classList.remove('bg-primary-container');
                btn.classList.add('bg-green-600');
                
                // Redirect logic would go here
            }, 1500);
        });

        // Add character count logic
        const remarks = document.getElementById('remarks');
        const counter = remarks.nextElementSibling;
        remarks.addEventListener('input', () => {
            const remaining = remarks.value.length;
            counter.innerText = `${remaining}/250 characters`;
            if (remaining > 250) {
                counter.classList.add('text-error');
            } else {
                counter.classList.remove('text-error');
            }
        });
    </script>
</body></html>
