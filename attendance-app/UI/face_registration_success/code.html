<script>
        // Micro-interaction for the checklist
        document.querySelectorAll('.flex.items-center.gap-md').forEach((item, index) => {
            item.style.opacity = '0';
            item.style.transform = 'translateX(-10px)';
            setTimeout(() => {
                item.style.transition = 'all 0.4s ease-out';
                item.style.opacity = '1';
                item.style.transform = 'translateX(0)';
            }, 600 + (index * 150));
        });

        // Add a slight shimmer to the button
        const btn = document.querySelector('button.bg-primary');
        setInterval(() => {
            btn.classList.add('brightness-110');
            setTimeout(() => btn.classList.remove('brightness-110'), 200);
        }, 3000);
