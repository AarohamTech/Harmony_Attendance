<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .progress-ring-track {
            stroke: var(--tw-outline-variant);
            stroke-width: 4px;
        }
        .progress-ring-fill {
            stroke: #2563EB;
            stroke-width: 4px;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.6s ease;
        }
        .camera-overlay {
            mask-image: radial-gradient(ellipse 65% 75% at 50% 45%, transparent 100%, black 100%);
            -webkit-mask-image: radial-gradient(ellipse 60% 70% at 50% 45%, transparent 100%, black 100%);
        }
        .face-guide-anim {
            animation: pulse-guide 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-guide {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.02); }
        }
    </style>

<body class="bg-background text-on-surface font-body-md text-body-md antialiased overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex items-center h-16 px-margin-mobile w-full bg-surface dark:bg-on-surface">
<button class="mr-4 p-2 rounded-full hover:bg-surface-container dark:hover:bg-surface-variant transition-colors duration-200">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-on-surface dark:text-inverse-on-surface">Enrollment</h1>
</header>
<main class="pt-16 pb-24 flex flex-col h-screen">
<!-- Progress Indicator -->
<section class="px-margin-mobile pt-4">
<div class="flex justify-between items-center mb-sm">
<span class="font-label-lg text-label-lg text-secondary">STEP 3 OF 5</span>
<span class="font-label-lg text-label-lg text-primary">40% Complete</span>
</div>
<div class="w-full bg-surface-container-high h-1.5 rounded-full overflow-hidden">
<div class="bg-primary h-full transition-all duration-500 ease-out" style="width: 40%"></div>
</div>
</section>
<!-- Instruction Header -->
<section class="px-margin-mobile py-lg text-center">
<h2 class="font-headline-sm text-headline-sm mb-sm">Turn your face slightly right (30°)</h2>
<p class="text-on-surface-variant">Ensure your entire face is visible and well-lit.</p>
</section>
<!-- Camera Canvas / Preview -->
<section class="flex-grow relative px-margin-mobile pb-md">
<div class="relative w-full h-full rounded-[32px] overflow-hidden bg-on-surface shadow-sm">
<!-- Camera Feed Placeholder -->
<div class="absolute inset-0 bg-cover bg-center" data-alt="A close-up portrait of a professional individual positioned slightly to the left, preparing to turn their head. The lighting is soft and corporate, mimicking a high-end office environment with neutral tones. The background is a clean, slightly blurred minimalist interior. The overall aesthetic is high-trust and secure, matching a modern enterprise HR application interface." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBWy49KShWQ_jPcYrI_5NDkcD5RqJ4hqo44BRdCX-CkM3xwpjaf_nZ4cdatF_seWs-Yrb257EDv8OiIM0-BoCCWC4cVXFrWEQbO8vFxRh2xPwIOi6EE636dBsCy_UvZ0gww3X8Xqx0_OLk7Kvdb8e3Ik5XFvo5B8an54ZYPT1AuQ_qUXPjg1lqlAcaUbmwz38x0Nda9nEXBX9R3JDWt-SDH309gQgPN-bba11eLsAz36y1pw7n_uZjv')">
</div>
<!-- Darkened Overlay with cutout -->
<div class="absolute inset-0 bg-black/40 camera-overlay"></div>
<!-- Face Guide Overlay -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-[75%] aspect-[3/4] border-2 border-primary/60 rounded-[100px] face-guide-anim relative">
<!-- Turning Indicator Arrow -->
<div class="absolute -right-8 top-1/2 -translate-y-1/2 flex flex-col items-center">
<span class="material-symbols-outlined text-primary-container text-[48px]" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
<span class="font-label-md text-label-md text-white drop-shadow-md">Turn Right</span>
</div>
</div>
</div>
<!-- Status Chips (Checked states) -->
<div class="absolute top-md left-md flex gap-sm">
<div class="flex items-center gap-xs bg-white/90 px-3 py-1.5 rounded-full shadow-sm">
<span class="material-symbols-outlined text-green-600 text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-lg text-label-lg text-on-surface">Front</span>
</div>
<div class="flex items-center gap-xs bg-white/90 px-3 py-1.5 rounded-full shadow-sm">
<span class="material-symbols-outlined text-green-600 text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-lg text-label-lg text-on-surface">Left</span>
</div>
<div class="flex items-center gap-xs bg-primary/90 px-3 py-1.5 rounded-full shadow-sm opacity-90 opacity-100">
<div class="w-2 h-2 bg-white rounded-full animate-pulse"></div>
<span class="font-label-lg text-label-lg text-white">Right</span>
</div>
</div>
</div>
</section>
<!-- Action Area -->
<section class="px-margin-mobile flex flex-col items-center gap-md pb-xl">
<button class="group relative flex items-center justify-center w-20 h-20 bg-primary rounded-full shadow-lg active:scale-95 transition-transform duration-150">
<div class="absolute inset-0 rounded-full border-4 border-primary-fixed opacity-30 group-active:scale-110 transition-transform"></div>
<span class="material-symbols-outlined text-white text-[36px]" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</button>
<p class="font-label-md text-label-md text-on-surface-variant text-center px-lg">
                Position your face within the frame and turn slowly to complete the scan.
            </p>
</section>
</main>
<!-- Bottom Navigation Suppressed for task focus as per mandate -->
<!-- But keeping bottom spacing/logic for flow -->
<script>
        // Simple micro-interaction for the camera button
        const cameraBtn = document.querySelector('button.group');
        cameraBtn.addEventListener('click', () => {
            // Visual feedback
            cameraBtn.classList.add('bg-primary-container');
            setTimeout(() => cameraBtn.classList.remove('bg-primary-container'), 200);
            
            // Logic for "capture" could go here
            console.log('Face angle captured');
        });

        // Atmospheric shimmer effect on the "Right" status chip
        const rightChip = document.querySelector('.bg-primary\\/90');
        setInterval(() => {
            rightChip.classList.toggle('opacity-90');
            rightChip.classList.toggle('opacity-100');
        }, 1000);
    </script>
