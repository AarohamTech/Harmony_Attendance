<script>
        // Simple micro-interaction for the "Done" button and a confetti burst on load
        document.addEventListener('DOMContentLoaded', () => {
            const mainContainer = document.querySelector('main');
            const colors = ['#2563EB', '#60A5FA', '#93C5FD', '#1E40AF'];
            
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '40%';
                mainContainer.appendChild(confetti);

                const angle = Math.random() * Math.PI * 2;
                const velocity = 5 + Math.random() * 10;
                const tx = Math.cos(angle) * 150 * Math.random();
                const ty = Math.sin(angle) * 150 * Math.random() - 100;

                confetti.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 1000 + Math.random() * 1000,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)',
                    fill: 'forwards'
                });
            }

            const doneBtn = document.querySelector('button.bg-primary-container');
            doneBtn.addEventListener('click', () => {
                doneBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
                setTimeout(() => {
                    window.location.reload(); // Simulate redirecting home
                }, 800);
            });
        });
    </script>
