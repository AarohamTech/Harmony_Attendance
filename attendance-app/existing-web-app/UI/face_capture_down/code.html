<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .progress-mask {
            mask-image: linear-gradient(to right, black 80%, transparent 80%);
        }
        .camera-overlay {
            background: radial-gradient(circle at center, transparent 35%, rgba(25, 27, 35, 0.7) 100%);
        }
        @keyframes pulse-guide {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.4; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .animate-pulse-guide {
            animation: pulse-guide 2s infinite ease-in-out;
        }
    </style>

<body class="bg-background text-on-surface flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-on-surface flex items-center h-16 px-margin-mobile w-full">
<div class="flex items-center space-x-4">
<button class="p-2 transition-colors duration-200 hover:bg-surface-container dark:hover:bg-surface-variant rounded-full text-on-surface">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-primary dark:text-primary-fixed">Enrollment</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-20 pb-24 px-margin-mobile flex flex-col items-center">
<!-- Progress Section -->
<div class="w-full max-w-md mb-8">
<div class="flex justify-between items-center mb-2">
<span class="font-label-lg text-label-lg text-on-surface-variant uppercase">Biometric Verification</span>
<span class="font-label-lg text-label-lg text-primary font-bold">80%</span>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary-container transition-all duration-500 ease-out" style="width: 80%;"></div>
</div>
</div>
<!-- Instruction Header -->
<div class="text-center mb-6">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-2">Look slightly downward</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Follow the on-screen guide for final capture.</p>
</div>
<!-- Camera Preview Container -->
<div class="relative w-full max-w-[320px] aspect-[3/4] rounded-[32px] overflow-hidden shadow-sm bg-surface-dim">
<!-- Simulated Camera Feed -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center" data-alt="A professional high-fidelity close-up of a diverse male employee looking slightly downward into a high-tech biometric camera interface. The background is a clean, bright corporate office with soft natural lighting. The image is crisp and professional, fitting an enterprise HR application aesthetic with soft shadows and a high-trust atmosphere." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDmzM0HHEzpbd5URncQfxlv9KSovPlQqsO4JmmtWsH0srHRcrHelj9PSfuX6aEW9sQETOizWevX5crMsoxgClil0xVgnTkf1Fpa3omH3vIyZaNMs8e4IPyfYau3U4KD9NSpjxmNrHDJp_deyyY3S9wyzfa9C5uSab_NFaxmMzlQVULnyq4-_X3s2iDMsAE7PAsoZVy_YhY6BVRz2AWYgTzoaUeJ-6WoKG4WGxoLM_BBVtMo3GJGr5Zr')"></div>
<!-- Camera Overlay UI -->
<div class="absolute inset-0 camera-overlay flex items-center justify-center">
<!-- Face Guide -->
<div class="w-64 h-80 border-2 border-white/50 rounded-[100px] flex items-center justify-center relative animate-pulse-guide">
<div class="absolute -bottom-4 bg-primary text-on-primary px-4 py-1 rounded-full text-label-md font-label-md shadow-sm">
                        Position face here
                    </div>
</div>
</div>
<!-- Direction Indicator -->
<div class="absolute inset-x-0 bottom-12 flex justify-center">
<div class="bg-white/20 backdrop-blur-md rounded-xl p-4 flex flex-col items-center border border-white/30">
<span class="material-symbols-outlined text-white text-[32px]">arrow_downward</span>
</div>
</div>
</div>
<!-- Step Checklist -->
<div class="mt-8 w-full max-w-md grid grid-cols-5 gap-2">
<!-- Front -->
<div class="flex flex-col items-center gap-1 opacity-100">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-md">check</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">Front</span>
</div>
<!-- Left -->
<div class="flex flex-col items-center gap-1 opacity-100">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-md">check</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">Left</span>
</div>
<!-- Right -->
<div class="flex flex-col items-center gap-1 opacity-100">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-md">check</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">Right</span>
</div>
<!-- Up -->
<div class="flex flex-col items-center gap-1 opacity-100">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-md">check</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">Up</span>
</div>
<!-- Down (Current) -->
<div class="flex flex-col items-center gap-1">
<div class="w-10 h-10 rounded-full bg-surface-container-highest border-2 border-primary-container flex items-center justify-center">
<div class="w-2 h-2 rounded-full bg-primary-container"></div>
</div>
<span class="font-label-md text-label-md text-primary font-bold">Down</span>
</div>
</div>
</main>
<!-- Bottom Action Bar -->
<div class="fixed bottom-0 left-0 right-0 p-margin-mobile bg-surface-container-lowest flex justify-center items-center">
<button class="w-full max-w-md bg-primary-container text-on-primary-container h-14 rounded-xl flex items-center justify-center gap-2 font-title-lg text-title-lg shadow-sm hover:bg-primary transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
            Capture
        </button>
</div>
<!-- Micro-interaction script -->
<script>
        // Simple logic to simulate camera ready state
        document.addEventListener('DOMContentLoaded', () => {
            const captureBtn = document.querySelector('button');
            captureBtn.addEventListener('mousedown', () => {
                captureBtn.classList.add('scale-95');
            });
            captureBtn.addEventListener('mouseup', () => {
                captureBtn.classList.remove('scale-95');
            });
        });
    </script>
</body></html>
