<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #faf8ff; /* background token */
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom focused state for MD3 Outlined Inputs */
        .md3-input:focus-within label {
            transform: translateY(-1.5rem) scale(0.85);
            color: #004ac6; /* primary */
            background-color: #ffffff;
            padding: 0 4px;
        }
        .input-focus-ring:focus {
            box-shadow: 0 0 0 2px #004ac6;
            border-color: transparent;
        }
    </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen">
<!-- Top Navigation Bar (Shared Component Implementation) -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-on-surface flex items-center h-16 px-margin-mobile w-full transition-colors duration-200">
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-surface-container dark:hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface dark:text-inverse-on-surface">Enrollment</h1>
</div>
</header>
<main class="pt-20 pb-12 px-margin-mobile max-w-lg mx-auto">
<!-- Header Section -->
<section class="mt-8 mb-10 text-center">
<h2 class="font-display-lg text-display-lg text-on-surface mb-xs">Create Employee Account</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">One-Time Registration</p>
</section>
<!-- Form Section -->
<form class="space-y-6" id="registrationForm">
<!-- Bento Grid for Visual Interest in Form Layout (Employee ID & Full Name) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Full Name -->
<div class="relative flex flex-col group">
<label class="absolute left-4 top-4 text-on-surface-variant font-body-md transition-all duration-200 pointer-events-none group-focus-within:text-primary group-focus-within:-translate-y-6 group-focus-within:scale-90 group-focus-within:bg-background group-focus-within:px-1">Full Name</label>
<input class="w-full h-14 px-4 rounded-xl border border-outline bg-transparent focus:border-primary focus:ring-0 font-body-lg transition-all peer" placeholder=" " required="" type="text">
</div>
<!-- Employee ID -->
<div class="relative flex flex-col group">
<label class="absolute left-4 top-4 text-on-surface-variant font-body-md transition-all duration-200 pointer-events-none group-focus-within:text-primary group-focus-within:-translate-y-6 group-focus-within:scale-90 group-focus-within:bg-background group-focus-within:px-1">Employee ID</label>
<input class="w-full h-14 px-4 rounded-xl border border-outline bg-transparent focus:border-primary focus:ring-0 font-body-lg transition-all peer" placeholder=" " required="" type="text">
</div>
</div>
<!-- Email Address -->
<div class="relative flex flex-col group">
<label class="absolute left-4 top-4 text-on-surface-variant font-body-md transition-all duration-200 pointer-events-none group-focus-within:text-primary group-focus-within:-translate-y-6 group-focus-within:scale-90 group-focus-within:bg-background group-focus-within:px-1">Email Address</label>
<input class="w-full h-14 px-4 rounded-xl border border-outline bg-transparent focus:border-primary focus:ring-0 font-body-lg transition-all peer" placeholder=" " required="" type="email">
</div>
<!-- Phone Number -->
<div class="relative flex flex-col group">
<label class="absolute left-4 top-4 text-on-surface-variant font-body-md transition-all duration-200 pointer-events-none group-focus-within:text-primary group-focus-within:-translate-y-6 group-focus-within:scale-90 group-focus-within:bg-background group-focus-within:px-1">Phone Number</label>
<input class="w-full h-14 px-4 rounded-xl border border-outline bg-transparent focus:border-primary focus:ring-0 font-body-lg transition-all peer" placeholder=" " required="" type="tel">
</div>
<!-- Password Fields with Modern Glass Card grouping -->
<div class="bg-surface-container-lowest p-4 rounded-xl shadow-sm border border-outline-variant space-y-4">
<!-- Password -->
<div class="relative flex flex-col group">
<label class="absolute left-4 top-4 text-on-surface-variant font-body-md transition-all duration-200 pointer-events-none group-focus-within:text-primary group-focus-within:-translate-y-6 group-focus-within:scale-90 group-focus-within:bg-surface-container-lowest group-focus-within:px-1">Password</label>
<input class="w-full h-14 px-4 rounded-xl border border-outline bg-transparent focus:border-primary focus:ring-0 font-body-lg transition-all peer" placeholder=" " required="" type="password">
</div>
<!-- Confirm Password -->
<div class="relative flex flex-col group">
<label class="absolute left-4 top-4 text-on-surface-variant font-body-md transition-all duration-200 pointer-events-none group-focus-within:text-primary group-focus-within:-translate-y-6 group-focus-within:scale-90 group-focus-within:bg-surface-container-lowest group-focus-within:px-1">Confirm Password</label>
<input class="w-full h-14 px-4 rounded-xl border border-outline bg-transparent focus:border-primary focus:ring-0 font-body-lg transition-all peer" placeholder=" " required="" type="password">
</div>
</div>
<!-- Terms & Conditions Checkbox -->
<div class="flex items-start gap-3 py-2 px-2">
<div class="relative flex items-center h-5">
<input class="h-5 w-5 rounded-md border-outline text-primary focus:ring-primary-container transition-all" id="terms" required="" type="checkbox">
</div>
<label class="font-body-md text-on-surface-variant" for="terms">
                    I agree to the <a class="text-primary font-semibold hover:underline" href="#">Terms &amp; Conditions</a> and understand how my data is managed by the corporate HRMS system.
                </label>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container text-on-primary-container h-14 rounded-full font-title-lg text-title-lg flex items-center justify-center gap-2 shadow-sm hover:brightness-110 active:scale-[0.98] transition-all" type="submit">
<span>Register</span>
<span class="material-symbols-outlined">how_to_reg</span>
</button>
</form>
<!-- Secondary Information -->
<div class="mt-8 text-center">
<p class="font-body-md text-on-surface-variant">
                Already have an account? 
                <a class="text-primary font-semibold" href="#">Sign In</a>
</p>
</div>
<!-- Decorative Element -->
<div class="mt-12 flex justify-center opacity-10">
<div class="w-32 h-32 rounded-full bg-primary blur-3xl"></div>
<div class="w-24 h-24 rounded-full bg-secondary-container blur-2xl -ml-8 mt-4"></div>
</div>
</main>
<!-- Visual Anchor Background Component -->
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
<div class="absolute inset-0 opacity-5 bg-cover bg-center" data-alt="A clean, minimalist corporate office lobby at dawn with soft natural light streaming through large windows. The scene is rendered in high-trust light-mode aesthetics with soft blues and whites. Blurred architectural lines create a sense of stability and institutional trust. High-quality 8k 3D architectural visualization style." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAqQE2zklNjKDr4bqKKuLpITWfNbG3ttRF9eJIgHimWEmuGFBANPCaZiMpHY77sDWvkeFdvI5iX4sYqBZvCSL-DR39zEBWhxJrLqOTIU5PhqDgmmbQdKstrjVCZ3wtTSa53f0v_zRKactDp9aOKKkbtV848LCZ71HqJr2ChbyTD_WgPCN5ryh2AEAeJNk0i49YnPBTGuuGRbRrH-EkzxNbyYCXK4cimXlfV5WmBEdkj1oH4Cc3gMIiv')"></div>
</div>
<!-- Interactive script for Floating Label behavior refinement -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('blur', () => {
                if (input.value.trim() !== '') {
                    input.nextElementSibling ? null : input.classList.add('filled');
                } else {
                    input.classList.remove('filled');
                }
            });
        });

        // Simple form validation micro-interaction
        const form = document.getElementById('registrationForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Processing...';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Registered!';
                btn.classList.replace('bg-primary-container', 'bg-green-600');
                btn.classList.replace('text-on-primary-container', 'text-white');
            }, 1500);
        });
    </script>
</body></html>
