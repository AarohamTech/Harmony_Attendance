<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Request Submitted - Harmony AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#6b6e70",
                        "on-primary-container": "#eeefff",
                        "on-primary-fixed": "#00174b",
                        "on-tertiary-fixed-variant": "#444749",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#f0f0fb",
                        "tertiary-fixed": "#e0e3e5",
                        "on-secondary-fixed": "#0b1c30",
                        "on-secondary-container": "#54647a",
                        "on-tertiary-fixed": "#191c1e",
                        "inverse-surface": "#2e3039",
                        "tertiary": "#525657",
                        "on-secondary-fixed-variant": "#38485d",
                        "secondary-fixed": "#d3e4fe",
                        "surface-container": "#ededf9",
                        "primary-fixed-dim": "#b4c5ff",
                        "primary-container": "#2563eb",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e1e2ed",
                        "outline-variant": "#c3c6d7",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#f3f3fe",
                        "background": "#faf8ff",
                        "on-primary-fixed-variant": "#003ea8",
                        "primary": "#004ac6",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "secondary-container": "#d0e1fb",
                        "surface-tint": "#0053db",
                        "surface-container-highest": "#e1e2ed",
                        "primary-fixed": "#dbe1ff",
                        "surface-container-high": "#e7e7f3",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-surface-variant": "#434655",
                        "on-error-container": "#93000a",
                        "surface-bright": "#faf8ff",
                        "surface-dim": "#d9d9e5",
                        "outline": "#737686",
                        "on-surface": "#191b23",
                        "on-error": "#ffffff",
                        "surface": "#faf8ff",
                        "secondary": "#505f76",
                        "on-tertiary-container": "#eff1f3",
                        "error": "#ba1a1a",
                        "inverse-primary": "#b4c5ff",
                        "on-background": "#191b23"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                    "spacing": {
                        "xs": "4px",
                        "md": "16px",
                        "edge_margin": "16px",
                        "xl": "32px",
                        "sm": "8px",
                        "lg": "24px",
                        "base": "4px",
                        "gutter": "12px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Inter"],

                        "body-sm": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["11px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],

                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]

                },
            },
        }

<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .success-check-pulse {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.3; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-surface dark:bg-background flex items-center justify-between px-md h-14">
<div class="flex items-center gap-4">
<button class="hover:bg-surface-container-low transition-colors p-2 rounded-full scale-95 active:opacity-80 transition-transform">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim">close</span>
</button>
<h1 class="font-title-lg text-title-lg text-primary dark:text-primary-fixed-dim">Success</h1>
</div>
<div class="flex items-center">
<!-- Empty div to maintain center-aligned style if needed or trailing actions -->
</div>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col items-center px-edge_margin pt-xl pb-32 max-w-lg mx-auto w-full">
<!-- Success Animation/Icon Area -->
<div class="relative flex items-center justify-center mb-lg">
<div class="absolute w-32 h-32 bg-green-100 rounded-full success-check-pulse"></div>
<div class="relative w-24 h-24 bg-green-500 rounded-full flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-white text-[48px]" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</div>
<!-- Messaging -->
<div class="text-center mb-xl">
<h2 class="font-headline-md-mobile text-headline-md-mobile md:font-headline-md md:text-headline-md text-on-surface mb-sm">
                Request Submitted Successfully
            </h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                Your request has been sent to your manager for approval. You will be notified once it is processed.
            </p>
</div>
<!-- Request Summary Card -->
<div class="w-full bg-surface-container-lowest rounded-xl p-md border border-outline-variant shadow-[0_2px_4px_rgba(0,0,0,0.04)] mb-xl">
<h3 class="font-title-lg text-title-lg text-on-surface mb-md">Request Details</h3>
<div class="space-y-gutter">
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-on-surface-variant">Type</span>
<span class="font-body-md text-body-md text-on-surface font-semibold">Sick Leave</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-on-surface-variant">Date</span>
<span class="font-body-md text-body-md text-on-surface font-semibold">Nov 24, 2023</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-on-surface-variant">Status</span>
<span class="inline-flex items-center px-3 py-1 rounded-full bg-orange-100 text-orange-700 text-label-md font-label-md">
                        Pending
                    </span>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full space-y-md">
<button class="w-full bg-primary-container text-white py-3 px-6 rounded-xl font-title-lg text-title-lg shadow-md active:scale-95 transition-transform">
                Go to Dashboard
            </button>
<button class="w-full text-primary font-title-lg text-title-lg py-3 hover:bg-primary/5 rounded-xl transition-colors">
                View All Requests
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 h-[56px] flex justify-around items-center px-edge_margin pb-safe bg-surface dark:bg-surface-container-lowest border-t border-outline-variant shadow-sm">
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-variant/20 transition-all duration-200 flex-1 h-full">
<span class="material-symbols-outlined">home</span>
<span class="font-label-md text-label-md">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-variant/20 transition-all duration-200 flex-1 h-full">
<span class="material-symbols-outlined">calendar_today</span>
<span class="font-label-md text-label-md">Attendance</span>
</button>
<!-- ACTIVE TAB: Requests -->
<button class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim bg-primary-container/10 rounded-full px-4 py-1 transition-all duration-200 flex-1 h-[48px] m-auto">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">assignment</span>
<span class="font-label-md text-label-md">Requests</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-variant/20 transition-all duration-200 flex-1 h-full">
<span class="material-symbols-outlined">person</span>
<span class="font-label-md text-label-md">Profile</span>
</button>
</nav>
<script>
        // Micro-interaction for feedback on button clicks
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });
    </script>
</body></html>
