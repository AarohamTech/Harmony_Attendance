<style>

<body class="bg-background text-on-surface min-h-screen flex flex-col">

<h1 class="font-title-lg text-title-lg text-primary dark:text-primary-fixed">Enrollment</h1>

<!-- Main Content Canvas -->
<main class="flex-1 mt-16 px-margin-mobile pb-32 flex flex-col">

<div class="h-full bg-primary-container w-1/5 transition-all duration-500 ease-out"></div>

<p class="font-body-md text-body-md text-on-surface-variant">Ensure your entire face is visible within the guide.</p>
</section>
<!-- Camera Preview Section (Bento-inspired container) -->
<section class="relative flex-1 min-h-[400px] w-full bg-on-surface rounded-3xl overflow-hidden shadow-sm">
<!-- Simulated Camera Feed -->

<span class="material-symbols-outlined">photo_camera</span>
                Capture
            </button>

<!-- Bottom Navigation Shell Suppression: Hidden because this is a focused task/onboarding step -->
<script>
        // Simple micro-interaction for the capture button
        const captureBtn = document.getElementById('captureBtn');
        captureBtn.addEventListener('click', () => {
            captureBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Processing...';
            captureBtn.classList.add('opacity-80');
            captureBtn.disabled = true;
            
            setTimeout(() => {
                captureBtn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Captured';
                captureBtn.classList.replace('bg-primary-container', 'bg-tertiary-container');
            }, 1500);
        });

        // Add a simple CSS animation for the scanner line via script
        const style = document.createElement('style');
        style.textContent = `
            @keyframes scan {
                0% { top: 0%; opacity: 0; }
                50% { opacity: 1; }
                100% { top: 100%; opacity: 0; }
            }
            .animate-scan {
                animation: scan 3s linear infinite;
            }
        `;
        document.head.appendChild(style);
    </script>
