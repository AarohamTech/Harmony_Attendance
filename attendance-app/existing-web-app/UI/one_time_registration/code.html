<!DOCTYPE html><html class="light" lang="en"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .form-input-focus:focus-within label {
            color: #004ac6;
            transform: translateY(-20px) scale(0.85);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.5);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md flex flex-col">
<!-- Top Navigation Shell Suppressed for Transactional Page as per guidelines -->
<main class="flex-grow flex flex-col items-center justify-center px-edge_margin py-xl relative overflow-hidden">
<!-- Subtle Atmospheric Background -->
<div class="absolute inset-0 pointer-events-none z-0">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-secondary-container/10 blur-[120px]"></div>
</div>
<!-- Branding / Identity Area -->
<div class="z-10 text-center mb-xl">
<div class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center mx-auto mb-md shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-white text-[32px]">fingerprint</span>
</div>
<h1 class="font-headline-md-mobile text-headline-md-mobile text-on-surface mb-xs">Create Employee Account</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Join Harmony AI Attendance system</p>
</div>
<!-- Registration Bento-Style Form Container -->
<div class="z-10 w-full max-w-md glass-card rounded-[24px] p-xl shadow-sm">
<form class="space-y-gutter" id="registrationForm">
<!-- Full Name Field -->
<div class="relative group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-1">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">person</span>
<input class="w-full pl-[48px] pr-md py-3 rounded-xl border border-outline-variant bg-surface hover:border-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md" placeholder="Enter your full name" required="" type="text">
</div>
</div>
<!-- Double Column for ID & Phone (Asymmetric Layout Feel) -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-gutter">
<div class="relative group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-1">Employee ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">badge</span>
<input class="w-full pl-[48px] pr-md py-3 rounded-xl border border-outline-variant bg-surface hover:border-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md" placeholder="ID Number" required="" type="text">
</div>
</div>
<div class="relative group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-1">Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">call</span>
<input class="w-full pl-[48px] pr-md py-3 rounded-xl border border-outline-variant bg-surface hover:border-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md" placeholder="+1..." required="" type="tel">
</div>
</div>
</div>
<!-- Email Address Field -->
<div class="relative group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-1">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">mail</span>
<input class="w-full pl-[48px] pr-md py-3 rounded-xl border border-outline-variant bg-surface hover:border-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md" placeholder="work@company.com" required="" type="email">
</div>
</div>
<!-- Password Fields -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-gutter">
<div class="relative group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-1">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock</span>
<input class="w-full pl-[48px] pr-md py-3 rounded-xl border border-outline-variant bg-surface hover:border-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md" placeholder="••••••••" required="" type="password">
</div>
</div>
<div class="relative group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-1">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock_reset</span>
<input class="w-full pl-[48px] pr-md py-3 rounded-xl border border-outline-variant bg-surface hover:border-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md" placeholder="••••••••" required="" type="password">
</div>
</div>
</div>
<!-- Terms & Conditions -->
<div class="flex items-start pt-xs">
<div class="flex items-center h-5">
<input class="w-5 h-5 text-primary border-outline-variant rounded focus:ring-primary transition-all cursor-pointer" id="terms" required="" type="checkbox">
</div>
<div class="ml-sm text-sm">
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="terms">
                            I accept the <a class="text-primary hover:underline font-medium" href="#">Terms &amp; Conditions</a> and <a class="text-primary hover:underline font-medium" href="#">Privacy Policy</a>.
                        </label>
</div>
</div>
<!-- Primary Register Button -->
<div class="pt-md">
<button class="w-full bg-primary-container text-white py-4 rounded-[14px] font-title-lg text-title-lg shadow-md hover:shadow-xl hover:bg-primary active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
                        Register
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Footer Area -->
<div class="z-10 mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already Registered? 
                <a class="text-primary font-bold hover:underline ml-xs" href="#">Login</a>
</p>
</div>
<!-- Background Image for Contextual Depth (Asymmetric Decorative Element) -->
<div class="absolute bottom-0 right-0 w-64 h-64 opacity-5 pointer-events-none translate-x-12 translate-y-12">
<div class="w-full h-full bg-contain bg-no-repeat bg-bottom" data-alt="A sophisticated digital pattern of interconnected human silhouettes and clock gears, rendered in a minimalist corporate style with clean lines and soft blue tones. The aesthetic is professional and tech-forward, representing an AI-driven human resource management system. High-quality render with soft, ambient lighting." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBl9jAZGxQb0KWnUddF6csHpLJpt_mrutNjZnwLJp_t8c64UQm0B-DYsEi9JHApF99cky01cD11B91pP__LtaJ4ubT4GNEp671XGrhXc7gJZxHbt-VQTDRACJjGemZ-a_mW7RGAzImP5O72WbyAaMlZ5ovZbxwGW3k4MK2PWssG56rGvCUNO25X1f8378ux-f9RuMdfbpRW545qLLbyy9fmEbZsglsiH4i42TnDSuMWTLk6WkZLKnjH')"></div>
</div>
</main>
<!-- Bottom Navigation Shell Suppressed as per UX Goal for Transactional Focus -->
<script>
        // Simple Interaction: Button Ripple-like Scale Effect
        const registerBtn = document.querySelector('button[type="submit"]');
        registerBtn.addEventListener('mousedown', () => registerBtn.style.transform = 'scale(0.97)');
        registerBtn.addEventListener('mouseup', () => registerBtn.style.transform = 'scale(1)');
        registerBtn.addEventListener('mouseleave', () => registerBtn.style.transform = 'scale(1)');

        // Form submission prevention for demo
        document.getElementById('registrationForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Registration request initiated. Connecting to Harmony AI services...');
        });
    </script>
</body></html>
