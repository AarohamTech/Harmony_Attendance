<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .radio-custom:checked + .radio-dot {
            border-color: #2563EB;

        }
        .radio-dot::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);

        }

<script>
        // Simple Interaction Logic
        const radios = document.querySelectorAll('input[type="radio"]');
        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                // Reset all labels
                document.querySelectorAll('label').forEach(label => {
                    const textSpan = label.querySelector('.font-title-lg');
                    const dot = label.querySelector('.radio-dot');
                    textSpan.classList.remove('text-primary-container');
                    textSpan.classList.add('text-on-surface');
                    dot.classList.remove('border-primary-container');
                    dot.classList.add('border-outline');
                });

                // Highlight active
                if (e.target.checked) {
                    const activeLabel = e.target.closest('label');
                    const activeText = activeLabel.querySelector('.font-title-lg');
                    const activeDot = activeLabel.querySelector('.radio-dot');
                    activeText.classList.remove('text-on-surface');
                    activeText.classList.add('text-primary-container');
                    activeDot.classList.remove('border-outline');
                    activeDot.classList.add('border-primary-container');
                }
            });
        });

        // Save Button Interaction
        document.querySelector('button.bg-primary-container').addEventListener('click', () => {
            const selected = document.querySelector('input[name="language"]:checked').value;
            console.log('Language saved:', selected);
            // Visual feedback
            const btn = document.querySelector('button.bg-primary-container');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Saving...';
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Saved Successfully';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 2000);
            }, 1000);
        });
    </script>
