<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #faf8ff;
            overflow: hidden;
        }

        .atmospheric-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 20%, #dbe1ff 0%, transparent 40%),
                        radial-gradient(circle at 80% 80%, #d0e1fb 0%, transparent 40%),
                        linear-gradient(135deg, #faf8ff 0%, #f0f0fb 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 74, 198, 0.08);
        }

        .input-focus-ring:focus-within {
            border-color: #004ac6;
            box-shadow: 0 0 0 4px rgba(0, 74, 198, 0.1);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Float animation for atmosphere */
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            z-index: -1;
            animation: float 12s ease-in-out infinite;
        }
    </style>

<body class="flex items-center justify-center min-h-screen p-md">
<!-- Atmospheric Background Elements -->
<div class="atmospheric-bg"></div>
<div class="orb bg-primary w-64 h-64 -top-20 -left-20"></div>
<div class="orb bg-secondary w-96 h-96 -bottom-32 -right-32" style="animation-delay: -3s;"></div>
<!-- Main Content Canvas -->
<main class="w-full max-w-[400px] z-10">
<!-- Glass Login Card -->
<div class="glass-card rounded-[24px] p-lg md:p-xl flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-lg">
<img alt="Harmony AI Attendance Logo" class="w-16 h-16 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLsCd_HHeB4w2GHL2UBLs7DiQaY1ghWRxtk7L-84LW1cdwV3FiyrERK1REcvdmxJSSGv6Ok8-Qa0ui-kBZtZFUIrY-OenJIf_ZBOG2YoLAN4uE_QKNV1rH1tB--2OvCN_kVDECnLs_AUNtNhembRBgE0r9ejXKFvFdaa7bg_ydtgPTVehFMm9m1rTvzc_NuzBOfnAK7oQZ9NCqzvA4iojrl7ELJofwML6n-U4sdTH-fnfjhpE4wCwVGSObc"/>
</div>
<!-- Header Section -->
<div class="text-center mb-xl">
<h1 class="font-headline-md-mobile text-headline-md-mobile text-on-surface mb-xs">Login to Your Account</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to continue</p>
</div>
<!-- Form Section -->
<form class="w-full space-y-md" onsubmit="return false;">
<!-- Email Input -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-1">Email Address</label>
<div class="relative group input-focus-ring flex items-center border border-outline-variant rounded-xl bg-surface-container-lowest transition-all">
<span class="material-symbols-outlined absolute left-4 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full bg-transparent border-none focus:ring-0 py-3 pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-outline-variant" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-1">Password</label>
<div class="relative group input-focus-ring flex items-center border border-outline-variant rounded-xl bg-surface-container-lowest transition-all">
<span class="material-symbols-outlined absolute left-4 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-transparent border-none focus:ring-0 py-3 pl-12 pr-12 font-body-md text-body-md text-on-surface placeholder:text-outline-variant" placeholder="••••••••" type="password"/>
<button class="absolute right-4 text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password -->
<div class="flex justify-end">
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<!-- Action Button -->
<div class="pt-2">
<button class="w-full h-12 bg-primary-container text-on-primary-container font-label-md text-label-md rounded-full shadow-lg hover:shadow-xl active:scale-95 transition-all flex items-center justify-center gap-2">
                        Sign In
                        <span class="material-symbols-outlined text-[20px]">login</span>
</button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-semibold hover:underline" href="#">Register</a>
</p>
</div>
</div>
<!-- System Status / Micro-interaction info -->
<div class="mt-lg flex justify-center items-center gap-4 text-outline-variant">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-sm text-label-sm">Secure Login</span>
</div>
<div class="h-1 w-1 bg-outline-variant rounded-full"></div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-sm">language</span>
<span class="font-label-sm text-label-sm">English (US)</span>
</div>
</div>
</main>
<script>
        // Simple micro-interaction for button press
        const loginBtn = document.querySelector('button');
        loginBtn.addEventListener('mousedown', () => {
            loginBtn.style.transform = 'scale(0.98)';
        });
        loginBtn.addEventListener('mouseup', () => {
            loginBtn.style.transform = 'scale(1)';
        });

        // Dynamic background mouse movement effect
        document.addEventListener('mousemove', (e) => {
            const orbs = document.querySelectorAll('.orb');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            orbs.forEach((orb, index) => {
                const moveX = (x - 0.5) * (index + 1) * 30;
                const moveY = (y - 0.5) * (index + 1) * 30;
                orb.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });
        });
    </script>
