<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
            opacity: 0.6;
        }
        @keyframes float {
            0% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-20px) translateX(10px); }
            100% { transform: translateY(0px) translateX(0px); }
        }
        .animate-float {
            animation: float 10s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col items-center justify-center font-body-md overflow-hidden relative">
<!-- Atmospheric Background -->
<div class="fixed inset-0 z-0 bg-gradient-to-br from-blue-50 via-white to-blue-100">
<div class="orb w-96 h-96 bg-primary/20 top-[-10%] left-[-10%] animate-float"></div>
<div class="orb w-80 h-80 bg-secondary/10 bottom-[-5%] right-[-5%] animate-float" style="animation-delay: -3s;"></div>
<div class="orb w-64 h-64 bg-primary/10 top-[20%] right-[10%] animate-float" style="animation-delay: -5s;"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-[412px] px-edge_margin">
<div class="glass-card rounded-2xl p-xl shadow-sm flex flex-col items-center">
<!-- Branding Header -->
<div class="mb-lg">
<img alt="Harmony AI Attendance" class="w-16 h-16 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLsCd_HHeB4w2GHL2UBLs7DiQaY1ghWRxtk7L-84LW1cdwV3FiyrERK1REcvdmxJSSGv6Ok8-Qa0ui-kBZtZFUIrY-OenJIf_ZBOG2YoLAN4uE_QKNV1rH1tB--2OvCN_kVDECnLs_AUNtNhembRBgE0r9ejXKFvFdaa7bg_ydtgPTVehFMm9m1rTvzc_NuzBOfnAK7oQZ9NCqzvA4iojrl7ELJofwML6n-U4sdTH-fnfjhpE4wCwVGSObc"/>
</div>
<!-- Header Text -->
<div class="text-center mb-xl">
<h1 class="font-headline-md-mobile text-headline-md-mobile text-on-surface mb-xs">Forgot Password?</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[280px]">
                    Enter your registered email address and we'll send you a link to reset your password.
                </p>
</div>
<!-- Form -->
<form class="w-full space-y-lg" id="forgotPasswordForm">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="mail">mail</span>
</div>
<input class="w-full h-12 pl-11 pr-md bg-white/50 border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none font-body-md" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
<span class="hidden font-label-sm text-label-sm text-error ml-xs" id="emailError">Please enter a valid email address.</span>
</div>
<button class="w-full h-12 bg-primary-container text-on-primary-container font-title-lg text-title-lg rounded-[14px] shadow-md hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
                    Send Reset Link
                </button>
</form>
<!-- Secondary Actions -->
<div class="mt-lg">
<a class="flex items-center gap-xs font-label-md text-label-md text-primary hover:underline transition-all" href="#">
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_back">arrow_back</span>
                    Back to Login
                </a>
</div>
</div>
<!-- Feedback Toast (Hidden by default) -->
<div class="fixed bottom-10 left-1/2 -translate-x-1/2 glass-card border-none bg-on-surface/90 text-surface-container-lowest px-lg py-sm rounded-full flex items-center gap-sm opacity-0 translate-y-4 transition-all duration-300 pointer-events-none" id="toast">
<span class="material-symbols-outlined text-green-400" data-icon="check_circle">check_circle</span>
<span class="font-label-md text-label-md">Reset link sent to your email.</span>
</div>
</main>
<!-- Footer Identity -->
<footer class="mt-xl relative z-10">
<p class="font-label-sm text-label-sm text-on-surface-variant opacity-60">
            Powered by Harmony AI • Secure Enterprise Portal
        </p>
</footer>
<script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email');
            const errorText = document.getElementById('emailError');
            const toast = document.getElementById('toast');
            const submitBtn = e.target.querySelector('button');

            // Basic Validation
            if (!emailInput.value || !emailInput.value.includes('@')) {
                emailInput.classList.add('border-error');
                errorText.classList.remove('hidden');
                return;
            }

            // UI Feedback
            emailInput.classList.remove('border-error');
            errorText.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Sending...';

            // Simulate Success
            setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-y-4');
                toast.classList.add('opacity-100', 'translate-y-0');
                
                submitBtn.innerHTML = 'Reset Link Sent';
                submitBtn.classList.replace('bg-primary-container', 'bg-tertiary-container');
                
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-4');
                    toast.classList.remove('opacity-100', 'translate-y-0');
                }, 3000);
            }, 1500);
        });

        // Focus ring effect for better glassmorphism feel
        const emailField = document.getElementById('email');
        emailField.addEventListener('focus', () => {
            emailField.parentElement.parentElement.classList.add('scale-[1.01]');
        });
        emailField.addEventListener('blur', () => {
            emailField.parentElement.parentElement.classList.remove('scale-[1.01]');
        });
    </script>
</body></html>
